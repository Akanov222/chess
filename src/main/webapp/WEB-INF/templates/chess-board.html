<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Java Chess Online</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #2c3e50; color: white; }
        .chess-board { border-collapse: collapse; border: 5px solid #34495e; margin-bottom: 20px; }
        .chess-square {
            width: 60px; height: 60px;
            text-align: center; vertical-align: middle;
            font-size: 40px; cursor: default;
        }
        .controls { background: #34495e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .status { margin-bottom: 15px; font-size: 1.2em; font-weight: bold; text-align: center; }
        .error { color: #e74c3c; background: #fadbd8; padding: 10px; border-radius: 4px; margin-bottom: 10px; font-size: 0.9em; }
        input[type="text"] { padding: 8px; width: 50px; border-radius: 4px; border: none; text-align: center; }
        button { padding: 8px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ecc71; }
    </style>
</head>
<body>
    <h1>Chessmate Project</h1>

    <!-- Статус хода -->
    <div class="status">
        Сейчас ходят: <span th:text="${turn}" th:style="'color: ' + (${turn.name() == 'WHITE'} ? '#f0d9b5' : '#8b4513')">WHITE</span>
    </div>

    <!-- Сообщение об ошибке (если есть) -->
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <table class="chess-board">
        <tr th:each="row : ${boardRows}">
            <td th:each="square : ${row}"
                th:id="${#strings.toLowerCase(square.coordinates.file)} + ${square.coordinates.rank}"
                th:onclick="'handleSquareClick(this.id)'"
                th:style="'background-color: ' + (${square.isDark} ? '#b58863' : '#f0d9b5')"
                class="chess-square clickable">

                <span th:text="${square.unicodeSymbol}"
                      th:style="'color: ' + (${square.piece != null && square.piece.color.name() == 'WHITE'} ? 'white' : 'black')">
                </span>
            </td>
        </tr>
    </table>

    <!-- Форма управления игрой -->
    <div class="controls">
        <form id="moveForm" th:action="@{/game}" method="post">
            <label>Откуда: </label>
            <input type="text" id="fromInput" name="from" placeholder="a2" maxlength="2" readonly required>

            <label>Куда: </label>
            <input type="text" id="toInput" name="to" placeholder="a4" maxlength="2" readonly required>

            <button type="submit">Сделать ход</button>
            <button type="button" onclick="resetSelection()" style="background: #7f8c8d; color: white; border: none; padding: 8px 10px; border-radius: 4px; cursor: pointer;">Сброс</button>
        </form>
    </div>

    <p style="margin-top: 20px; font-size: 0.8em; color: #bdc3c7;">
        Используйте формат a1-h8. Пример: b1 c3
    </p>
    <script>
        let fromSquare = null;

        function handleSquareClick(coord) {
            const fromInput = document.getElementById('fromInput');
            const toInput = document.getElementById('toInput');
            const clickedElement = document.getElementById(coord);

            if (!fromSquare) {
                // ПЕРВЫЙ КЛИК: Выбираем откуда ходим
                fromSquare = coord;
                fromInput.value = coord;
                clickedElement.classList.add('selected');
            } else {
                // ВТОРОЙ КЛИК: Куда ходим
                if (fromSquare === coord) {
                    resetSelection();
                    return;
                }
                toInput.value = coord;
                // Автоматически отправляем форму после второго клика
                document.getElementById('moveForm').submit();
            }
        }

        function resetSelection() {
            fromSquare = null;
            document.getElementById('fromInput').value = '';
            document.getElementById('toInput').value = '';
            document.querySelectorAll('.chess-square').forEach(el => el.classList.remove('selected'));
        }
    </script>
</body>
</html>
